apiVersion: 1

providers:
  - name: 'SO1 Dashboards'
    orgId: 1
    folder: 'SO1 Proyecto 2'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # El dashboard se administra desde el JSON versionado para evitar que
    # una edición accidental en Grafana deje una versión distinta al repo.
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards

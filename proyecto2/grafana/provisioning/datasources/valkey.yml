apiVersion: 1

datasources:
  - name: Redis-Valkey
    type: redis-datasource
    access: proxy
    url: redis://valkey:6379
    isDefault: true
    uid: redis-valkey
    editable: true
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0

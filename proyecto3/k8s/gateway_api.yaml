apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: war-gateway
  namespace: default
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: war-http-route
  namespace: default
spec:
  parentRefs:
    - name: war-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202304063
      backendRefs:
        - name: api-rust-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: api-rust-service
          port: 8080
